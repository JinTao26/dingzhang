name: Bootstrap

# 一次性工作流：从源码快照解出完整工程并提交，跑完自我清理。
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download payload
        run: |
          set -e
          curl -fL --retry 3 --retry-delay 2 -o /tmp/dz.tgz "https://aka.doubaocdn.com/s/PyuziKaidm"
          ls -lh /tmp/dz.tgz
          head -c 2 /tmp/dz.tgz | xxd | head -1

      - name: Extract
        run: |
          set -e
          tar xzf /tmp/dz.tgz -C .
          rm -rf bootstrap
          find app -name "*.kt" | wc -l
          ls -la

      - name: Commit
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: import dingzhang v0.4.0 source tree" || echo "nothing to commit"
          git push
